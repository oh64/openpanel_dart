name: openpanel_dart
description: >-
  Pure Dart analytics client for OpenPanel.
  Track events, identify users and manage groups via the HTTP API.
  Works on Flutter as well as plain Dart (CLI, server, web).
version: 0.1.3
homepage: https://github.com/oh64/openpanel_dart
topics:
  - analytics
  - openpanel

environment:
  sdk: ^3.6.0

workspace:
  - example
  - openpanel_dart_flutter
  - openpanel_dart_flutter/example

dependencies:
  dio: ^5.9.0
  meta: ^1.16.0
  uuid: ^4.5.2
  web: ^1.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
